<div class="container">
  <div class="container-fluid center">
    <div class="contact" data-reveal="left">
      <form id="contactForm" method="post">
        <div class="input-container">
          <div class="input-group">
            <input name="name" type="text" placeholder="Name" required />
            <img src="/images/icons/person_outline.svg" aria-hidden="true" />
          </div>
        </div>
  
        <div class="input-container">
          <div class="input-group">
            <input name="mail" type="email" placeholder="Email" required />
            <img src="/images/icons/alternate_email.svg" aria-hidden="true" />
          </div>
        </div>
  
        <div class="input-container">
          <div class="input-group">
            <input name="subject" type="text" placeholder="Subject" />
            <img src="/images/icons/subject.svg" aria-hidden="true" />
          </div>
        </div>
  
        <div class="input-container">
          <div class="input-group">
            <textarea
              name="message"
              rows="4"
              placeholder="Message"
              data-length="1000"
              required
            ></textarea>
          </div>
        </div>
        <button type="submit" class="btn secondary" style="width: 120px">
          Send
        </button>
      </form>
    </div>
    <div class="hide-small" data-reveal="right" style="align-self: center">
      <img
        src="/images/logo/LogoDaldoBlack.png"
        alt="logo Daldo's website"
        class="mylogo"
      />
    </div>
  </div>
</div>
